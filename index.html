<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CompePharma — Modular CRM &amp; HR</title>
<meta name="description" content="A modular CRM + HR platform. Activate only the modules you need — CRM, HR, Recruiting, and Document Center.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700;8..60,800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#000000">
<style>
  /* Same tokens as the CompePharma news site (portal.py) so the app reads as one brand. */
  :root{
    --ink:#0d1321;--ink-2:#3a4456;--muted:#5d6677;--line:#e3e6eb;
    --paper:#fff;--soft:#f3f5f8;--navy:#000;--red:#e4322b;
    --brand:#e4322b;--brand-700:#c2271f;--brand-050:#fdecea;
    --accent:#1f6feb;--danger:#d7263d;--gold:#f5a623;--green:#0f9d58;
    --radius:6px;--shadow:none;--shadow-lg:0 14px 44px rgba(10,23,48,.22);
    --font:Inter,system-ui,"Segoe UI",Roboto,sans-serif;
    --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme=light]){
    --ink:#e7eaf0;--ink-2:#c3cbd8;--muted:#9aa4b5;--line:#1f2a3a;--paper:#0a0f18;--soft:#0f1622;
    --brand-050:#3a0f16;--brand-700:#ff6b63}}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font:16px/1.55 var(--font);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  h1,h2,h3{font-family:var(--font);font-weight:800;letter-spacing:-.02em}
  .wrap{max-width:1480px;margin:0 auto;padding:0 32px}@media(max-width:700px){.wrap{padding:0 16px}}

  /* buttons: square, heavy, red like the news site */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;font-family:inherit;
    font-weight:800;font-size:13.5px;letter-spacing:.02em;border-radius:2px;padding:11px 18px;transition:.15s;line-height:1}
  .btn:hover{filter:brightness(1.08)}
  .btn-primary{background:var(--red);color:#fff}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}.btn-ghost:hover{background:var(--soft)}
  .btn-teal{background:var(--brand);color:#fff}
  .btn-sm{padding:8px 13px;font-size:12.5px}
  .btn-lg{padding:13px 22px;font-size:14px}
  .btn:disabled{opacity:.55;cursor:default}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper)}

  /* ---------- utility bar + masthead (mirrors the news site) ---------- */
  .util{background:#000;border-bottom:1px solid #222;color:#9a9a9a;font-size:12.5px}
  .util .wrap{display:flex;justify-content:space-between;align-items:center;height:34px;gap:12px}
  .util a{color:#e5ebf5;font-weight:600;margin-left:18px}.util a:hover{color:#fff}.util a.on{color:#fff;box-shadow:inset 0 -2px 0 var(--red)}
  @media(max-width:700px){.util .d,.util .vx{display:none}.util .wrap{justify-content:flex-end}.util a{margin-left:12px;white-space:nowrap}}
  header{background:#000;position:sticky;top:0;z-index:30}
  header .btn-ghost{color:#fff;border-color:#fff}header .btn-ghost:hover{background:#1a1a1a}
  header .wrap{display:flex;align-items:center;gap:16px;height:72px}
  .logo{display:inline-block;white-space:nowrap;font:900 32px/1 var(--font);letter-spacing:-.045em}
  .logo{color:#fff}.logo b{color:var(--red)}
  .logo .prod{font:800 11.5px/1 var(--font);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--red);padding:5px 8px;border-radius:3px;position:relative;top:-6px;margin-left:12px;letter-spacing:.1em}
    @media(max-width:600px){.logo{font-size:25px}.logo .prod{display:none}}
  .spacer{flex:1}
  #topauth{display:flex;gap:8px;align-items:center}
  .acct{position:relative}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;
    display:grid;place-items:center;font-weight:800;cursor:pointer}
  .menu{position:absolute;right:0;top:46px;background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:4px;
    box-shadow:var(--shadow-lg);min-width:220px;padding:8px;display:none}
  .menu.open{display:block}.menu .mi{display:block;padding:9px 12px;border-radius:3px;font-size:14px;cursor:pointer}
  .menu .mi:hover{background:var(--soft)}.menu .sep{height:1px;background:var(--line);margin:6px 4px}

  /* ---------- shell ---------- */
  .shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 106px)}
  .side{background:var(--soft);border-right:1px solid var(--line);padding:18px 12px}
  .side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:18px 10px 6px;font-weight:900}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:3px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-2);border-left:3px solid transparent}
  .nav-item:hover{background:var(--paper);color:var(--ink)}
  .nav-item.active{background:var(--paper);color:var(--ink);border-left-color:var(--red)}
  .nav-item .ico{width:22px;text-align:center}
  .nav-item.locked{color:var(--muted)}
  .nav-item .lk{margin-left:auto;font-size:12px;opacity:.6}
  main{padding:28px 34px;max-width:1240px}
  .page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px}
  .page-h h1{font:900 34px/1.05 var(--font);letter-spacing:-.03em;margin:0}
  .page-h p,.hero p,.mod .tl{font-family:var(--serif)}
  .page-h p{margin:6px 0 0;color:var(--muted);font-size:15px}

  /* ---------- cards / stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:0;padding:14px 18px}
  .stat .v{font:900 30px/1.1 var(--font);letter-spacing:-.03em}
  .stat .k{font-size:11.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.09em;font-weight:800}
  .panel{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:0;margin-bottom:22px;overflow:hidden}
  .panel-h{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line)}
  .panel-h h3{margin:0;font:900 13px/1.2 var(--font);letter-spacing:.1em;text-transform:uppercase}
  .panel-b{padding:6px 0}
  .subtabs{display:flex;gap:2px;margin-bottom:18px;flex-wrap:wrap;background:#000;padding:0 6px}
  .subtab{border:0;border-bottom:3px solid transparent;background:transparent;padding:13px 14px 11px;font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#dfe6f2;cursor:pointer;font-family:inherit}
  .subtab:hover{color:#fff;background:rgba(255,255,255,.06)}
  .subtab.active{color:#fff;border-bottom-color:var(--red)}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;padding:10px 18px;border-bottom:1px solid var(--line)}
  td{padding:11px 18px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--soft)}
  .pill{display:inline-block;padding:3px 8px;border-radius:3px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  .pill.Lead,.pill.Applied,.pill.Pending{background:#eef2f7;color:#5b6b80}
  .pill.Qualified,.pill.Screen{background:#e9f0ff;color:#2b57c9}
  .pill.Proposal,.pill.Interview{background:#fff2e0;color:#b5730d}
  .pill.Won,.pill.Hired,.pill.Approved,.pill.Active{background:#e7f8ef;color:#0b7a43}
  .pill.Lost,.pill.Rejected,.pill.Declined{background:#fdecea;color:#c0392b}
  .pill.Offer{background:#efe7ff;color:#6b3fd4}
  select.mini{border:1px solid var(--line);border-radius:3px;padding:5px 8px;font-weight:700;font-size:12.5px;cursor:pointer}
  .empty{padding:26px 18px;color:var(--muted);text-align:center;font-size:14px}

  /* inline add form */
  .addbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;background:var(--soft);border-top:1px solid var(--line)}
  .addbar input,.addbar select{height:38px;border:1px solid var(--line);border-radius:4px;padding:0 11px;min-width:120px;flex:1}
  .addbar textarea{border:1px solid var(--line);border-radius:4px;padding:9px 11px;width:100%}

  /* ---------- module store ---------- */
  .mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
  .mod{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);border-radius:0;padding:20px;display:flex;flex-direction:column}
  .mod.owned{border-top-color:var(--brand)}
  .mod .ic{font-size:30px}
  .mod h3{margin:10px 0 4px;font-size:21px;font-weight:800}
  .mod .tl{color:var(--muted);font-size:15.5px;margin:0 0 12px}
  .mod ul{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:7px}
  .mod li{font-size:14px;color:var(--ink-2);display:flex;gap:8px}
  .mod li .ck{color:var(--brand);font-weight:900}
  .mod .price{font:900 26px/1 var(--font);letter-spacing:-.03em;margin-bottom:14px}
  .mod .price small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}
  .mod .btn{margin-top:auto}
  .owned-tag{display:inline-flex;align-items:center;gap:6px;color:var(--brand);font-weight:900;font-size:12px;letter-spacing:.1em;text-transform:uppercase}
  .bundle{background:#000;color:#fff;border-radius:0;border-top:4px solid var(--red);padding:24px;display:flex;
    align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
  .bundle h3{margin:0 0 4px;font-size:24px;color:#fff}.bundle p{margin:0;color:#c3cede;font-size:14.5px}
  .bundle .price{font:900 30px/1 var(--font);letter-spacing:-.03em}

  /* ---------- daily email ---------- */
  .daily{background:#000;color:#e5ebf5;border-top:4px solid var(--red);padding:22px 24px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 22px}
  .daily .k{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
  .daily h3{color:#fff;margin:6px 0 4px;font-size:24px}.daily p{margin:0;color:#c3cede;font-size:14.5px;max-width:56ch}
  .daily form{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:260px;max-width:440px}
  .daily input{flex:1;min-width:180px;height:42px;padding:0 12px;border:1px solid #333;border-radius:2px;background:#111;color:#fff}
  .daily input::placeholder{color:#8a97ad}
  .daily .done{font-weight:800;color:#fff}

  /* ---------- landing ---------- */
  .land{max-width:1180px;margin:0 auto;padding:30px 32px 10px}
  .kicker{display:inline-block;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--red);border-left:3px solid var(--red);padding-left:7px;line-height:1.1}
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:24px 0 46px;border-bottom:1px solid var(--line);margin-bottom:34px}
  .hero h1{font:900 52px/1.04 var(--font);letter-spacing:-.035em;margin:14px 0 16px}
  .hero h1 span{color:var(--red)}
  .hero p{font:19px/1.55 var(--serif);color:var(--ink-2);margin:0 0 24px;max-width:44ch}
  .hero-card{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);padding:6px 20px 10px}
  .hero-card h4{margin:12px 0 4px;font:900 13px/1 var(--font);letter-spacing:.1em;text-transform:uppercase}
  .hero-card .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font:700 15.5px/1.3 var(--font)}
  .hero-card .row:first-of-type{border-top:0}
  .hero-card .row .i{width:34px;height:34px;border-radius:3px;background:var(--soft);display:grid;place-items:center;font-size:18px}
  .sec-h{display:flex;align-items:baseline;justify-content:space-between;border-top:4px solid var(--ink);padding-top:10px;margin:0 0 6px}
  .sec-h span{font-weight:900;font-size:14px;letter-spacing:.1em;text-transform:uppercase}

  footer{background:#000;color:#9eabc2;margin-top:56px;padding:40px 0 26px;font-size:14px}
  footer .fg{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:30px}@media(max-width:800px){footer .fg{grid-template-columns:1fr 1fr}}
  footer h4{color:#fff;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;font-family:var(--font);font-weight:900}
  footer ul{margin:0;padding:0}footer li{list-style:none;margin:6px 0}
  footer a:hover{color:#fff}footer .logo{font-size:30px;color:#fff}footer .fine{border-top:1px solid #222;margin-top:28px;padding-top:16px;font-size:12.5px}

  .overlay{position:fixed;inset:0;background:rgba(10,23,48,.6);backdrop-filter:blur(3px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto}
  .overlay.open{display:flex}
  .modal{background:var(--paper);border-top:4px solid var(--ink);border-radius:4px;max-width:420px;width:100%;box-shadow:var(--shadow-lg);padding:28px;position:relative}
  .modal.wide{max-width:620px}
  .modal.wide input,.modal.wide select,.modal.wide textarea{width:100%;border:1px solid var(--line);border-radius:4px;padding:8px 11px;font:inherit;font-size:13.5px;box-sizing:border-box}
  .modal.wide input:focus,.modal.wide select:focus,.modal.wide textarea:focus{outline:none;border-color:var(--ink)}
  .stepper{display:flex;flex-direction:column;gap:10px}
  .stp{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--paper)}
  .stp.done{background:var(--brand-050);border-color:#cdeadd}
  .stp.act{border-color:var(--ink);border-left:4px solid var(--red)}
  .stp.rej{background:#fdf4f3;border-color:#f3cfca;color:#0d1321}
  .stp.wait{background:var(--soft);opacity:.85}
  .stp-h{display:flex;align-items:center;gap:8px;font-size:14.5px}
  .stp-b{font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.5}
  .modal-x{position:absolute;top:14px;right:16px;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
  .modal h2{margin:0 0 4px;font-size:26px}
  .modal .swi{color:var(--muted);font-size:14px;margin:0 0 18px}.modal .swi a{color:var(--red);font-weight:700;cursor:pointer}
  .field{margin-bottom:12px}.field label{display:block;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;margin-bottom:6px;color:var(--ink-2)}
  .field input{width:100%;height:42px;border:1px solid var(--line);border-radius:4px;padding:0 12px}
  .field input:focus,.addbar input:focus,.addbar select:focus{outline:none;border-color:var(--ink)}
  .err{background:#fdecea;color:#c0392b;border-radius:4px;padding:9px 12px;font-size:13.5px;margin-bottom:12px;display:none}
  .err.show{display:block}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#000;color:#fff;border-left:4px solid var(--red);padding:12px 18px;border-radius:3px;font-size:14px;box-shadow:var(--shadow-lg);z-index:80;display:none}
  .toast.show{display:block}
  .lockbox{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ink);padding:40px;text-align:center}
  .lockbox .ic{font-size:40px}
  .lockbox h2{margin:12px 0 6px}.lockbox p{color:var(--muted);margin:0 0 18px}
  @media(max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}.hero{grid-template-columns:1fr}.hero-card{display:none}.hero h1{font-size:34px}main{padding:22px 16px}.land{padding:20px 16px}}
</style>
</head>
<body>

<div class="util"><div class="wrap"><span class="d" id="today"></span>
  <span><a href="/">News</a><a href="/insights">Insights</a><a href="/newsletter">Daily email</a><a class="vx" href="/market-analysis">Market analysis</a><a class="vx" href="/enterprise">Enterprise</a><a class="vx" href="https://vigi-eye.com/?utm_source=compepharma">VigiEye regulatory news</a><a class="on" href="/app">CRM &amp; HR</a></span></div></div>
<header><div class="wrap">
  <a class="logo" href="/app">Compe<b>Pharma</b><span class="prod">CRM &amp; HR</span></a>
  <div class="spacer"></div>
  <div id="topauth"></div>
</div></header>

<div id="root"></div>
<div class="toast" id="toast"></div>

<!-- auth modal -->
<div class="overlay" id="authOverlay" onclick="if(event.target===this)closeAuth()">
  <div class="modal">
    <span class="modal-x" onclick="closeAuth()">×</span>
    <h2 id="authTitle">Create your account</h2>
    <p class="swi" id="authSwitch"></p>
    <div class="err" id="authErr"></div>
    <form id="authForm" onsubmit="return submitAuth(event)">
      <div class="field" id="nameField"><label>Your name</label><input id="f_name" type="text" placeholder="Jane Doe"></div>
      <div class="field" id="orgField"><label>Organization</label><input id="f_org" type="text" placeholder="Acme Pharma"></div>
      <div class="field"><label>Email</label><input id="f_email" type="email" required placeholder="you@company.com"></div>
      <div class="field"><label>Password</label><input id="f_pass" type="password" required minlength="8" placeholder="••••••••"></div>
      <button class="btn btn-primary btn-lg" style="width:100%" id="authSubmit">Create account</button>
    </form>
  </div>
</div>

<div class="overlay" id="docOverlay" onclick="if(event.target===this)closeDoc()">
  <div class="modal wide" id="docModalBody"></div>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
let ME=null, VIEW="dashboard", SUB={};

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),3000);}
async function api(path,opts){const r=await fetch(path,Object.assign({headers:{"Content-Type":"application/json"}},opts));let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,data:j};}
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>"$"+Number(n||0).toLocaleString();
const dateOf=s=>s?new Date(s).toLocaleDateString():"";

(function(){const d=document.getElementById("today");if(d)d.textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"2-digit",month:"long",year:"numeric"});})();
async function boot(){
  const {data}=await api("/api/me");
  ME=data;
  renderTop();
  if(!ME.authenticated){ renderLanding(); handlePurchase(); return; }
  if(!ROUTES[VIEW]) VIEW="dashboard";
  renderShell(); handlePurchase();
}

/* ---------- top bar ---------- */
function renderTop(){
  const el=$("#topauth");
  if(ME&&ME.authenticated){
    const ini=(ME.name||ME.email||"?").slice(0,1).toUpperCase();
    el.innerHTML=`<div class="acct"><div class="avatar" onclick="document.getElementById('acctMenu').classList.toggle('open')">${ini}</div>
      <div class="menu" id="acctMenu">
        <div style="padding:8px 12px;font-size:13px;color:var(--muted)">${esc(ME.email)}</div>
        ${ME.org?`<div style="padding:0 12px 8px;font-size:13px;font-weight:600">${esc(ME.org)}</div>`:''}
        <div class="sep"></div>
        <div class="mi" onclick="go('store')">Manage modules</div>
        <a class="mi" href="/api/logout">Log out</a>
      </div></div>`;
  } else {
    el.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="openAuth('login')">Log in</button>
      <button class="btn btn-primary btn-sm" onclick="openAuth('register')">Get started</button>`;
  }
}
document.addEventListener("click",e=>{const m=$("#acctMenu");if(m&&!e.target.closest(".acct"))m.classList.remove("open");});

/* ---------- landing (signed out) ---------- */
function renderLanding(){
  const mods=(ME.modules||[]);
  $("#root").innerHTML=`
  <div class="land">
    <div class="hero">
      <div>
        <span class="kicker">CompePharma CRM &amp; HR</span>
        <h1>Run your business on the <span>modules you actually need.</span></h1>
        <p>CompePharma is a modular CRM &amp; HR platform. Turn on CRM, HR, Recruiting, or the Document Center independently — and only pay for what you use.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button class="btn btn-primary btn-lg" onclick="openAuth('register')">Start free</button>
          <button class="btn btn-ghost btn-lg" onclick="document.getElementById('modstore').scrollIntoView({behavior:'smooth'})">See modules</button>
        </div>
      </div>
      <div class="hero-card"><h4>Modules</h4>
        ${mods.map(m=>`<div class="row"><span class="i">${m.icon}</span>${esc(m.name)}<span style="margin-left:auto;color:var(--muted);font-weight:600">$${m.price}/mo</span></div>`).join("")}
      </div>
    </div>
    <div id="modstore">
      <div class="sec-h"><span>Pick your modules</span></div>

async function activate(key){

  if(ME.billing){

    const {ok,data}=await api("/api/checkout",{method:"POST",body:JSON.stringify({module:key})});

function stat(v,k){return `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`;}

function tableView(cfg){
  // cfg: {cols:[{key,label,fmt?}], rows, addFields:[{key,ph,type?,opts?}], onAdd, actions?(row)}
  const head=cfg.cols.map(c=>`<th>${c.label}</th>`).join("")+(cfg.actions?'<th></th>':'');
  const body=cfg.rows.length? cfg.rows.map(r=>{
    const tds=cfg.cols.map(c=>`<td>${c.fmt?c.fmt(r[c.key],r):esc(r[c.key])}</td>`).join("");
    return `<tr>${tds}${cfg.actions?`<td style="text-align:right">${cfg.actions(r)}</td>`:''}</tr>`;
  }).join("") : `<tr><td colspan="${cfg.cols.length+(cfg.actions?1:0)}"><div class="empty">${cfg.empty||'Nothing here yet — add your first below.'}</div></td></tr>`;
  const fields=cfg.addFields.map(f=>{
    if(f.type==="select") return `<select id="af_${f.key}">${f.opts.map(o=>`<option>${o}</option>`).join("")}</select>`;
    return `<input id="af_${f.key}" placeholder="${f.ph}" ${f.type?`type="${f.type}"`:''}>`;
  }).join("");
  return `<div class="panel"><div class="panel-h"><h3>${cfg.title}</h3><span style="color:var(--muted);font-size:13px">${cfg.rows.length} total</span></div>
    <div style="overflow-x:auto"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
    <div class="addbar">${fields}<button class="btn btn-primary btn-sm" onclick="${cfg.onAdd}">＋ Add</button></div></div>`;
}
function readFields(keys){const o={};keys.forEach(k=>{const el=$("#af_"+k);o[k]=el?el.value.trim():"";});return o;}

function closeDoc(){ $("#docOverlay").classList.remove("open"); CURDOC=null; }
function fmtWhen(s){ return s?new Date(s).toLocaleString():''; }

function roleOptions(sel){
  const opts=DOCROLES.map(r=>`<option ${r.role===sel?'selected':''}>${esc(r.role)}</option>`).join("");
  return opts;
}
function stepRowHTML(role="",name="",email=""){
  return `<div class="rstep" style="display:grid;grid-template-columns:1.2fr 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:8px">
    <select class="rrole">${roleOptions(role)}</select>
    <input class="rname" placeholder="Approver name" value="${esc(name)}">
    <input class="remail" placeholder="Email (optional)" value="${esc(email)}">
    <button class="btn btn-ghost btn-sm" title="Remove" onclick="this.closest('.rstep').remove()">✕</button>
  </div>`;
}
function addStepRow(){ $("#routeRows").insertAdjacentHTML("beforeend", stepRowHTML(DOCROLES[0]?.role||"")); }

function renderDocModal(){
  const d=CURDOC; if(!d) return;
  const body=(d.body||"").trim();
  const preview=body?`<div style="background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;color:var(--ink-2);max-height:120px;overflow:auto;white-space:pre-wrap">${esc(body.slice(0,600))}${body.length>600?'…':''}</div>`:'';
  let section="";
  if(d.status==="Draft"||d.status==="Rejected"){
    const rej=(d.steps||[]).find(s=>s.status==="rejected");
    const rejbanner=(d.status==="Rejected"&&rej)?`<div class="err" style="display:block">Rejected by ${esc(rej.signed_name||rej.role)}${rej.comment?` — “${esc(rej.comment)}”`:''}. Revise and re-send below.</div>`:'';
    // seed default pharma route when nothing set yet
    const seed=["Regulatory Affairs","Pharmacovigilance (QPPV)","Management"];
    const rows=seed.map(r=>stepRowHTML(r)).join("");
    section=`${rejbanner}
      <h3 style="margin:18px 0 6px;font-size:15px">Send for approval</h3>
      <p style="color:var(--muted);font-size:13px;margin:0 0 12px">Add the roles that must sign off, in order. Each approver signs after the previous one.</p>
      <div id="routeRows">${rows}</div>
      <button class="btn btn-ghost btn-sm" onclick="addStepRow()">＋ Add role</button>
      <div style="display:flex;gap:8px;margin-top:18px">
        <button class="btn btn-primary" onclick="submitRoute(${d.id})">🖊 Send for approval</button>
        <button class="btn btn-ghost" onclick="closeDoc()">Cancel</button>
      </div>`;
  } else if(d.status==="In Review"){
    section=`<h3 style="margin:18px 0 10px;font-size:15px">Approval route</h3>
      <div class="stepper">${(d.steps||[]).map(s=>stepView(s)).join("")}</div>
      <div style="margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="resetRoute(${d.id})">Withdraw &amp; revise</button></div>`;
  } else if(d.status==="Approved"){
    section=`<div style="background:linear-gradient(120deg,#0d1b1a,#12403a);color:#fff;border-radius:14px;padding:18px 20px;margin:16px 0">
        <div style="font-size:15px;font-weight:800">✓ Approved material</div>
        <div style="opacity:.85;font-size:13px;margin-top:2px">Fully signed off on ${fmtWhen(d.approved_at)} · version ${d.version||1}</div>
      </div>
      <h3 style="margin:6px 0 10px;font-size:15px">Signature manifest</h3>
      <div class="stepper">${(d.steps||[]).map(s=>stepView(s)).join("")}</div>
      <div style="margin-top:16px"><button class="btn btn-ghost btn-sm" onclick="resetRoute(${d.id})">Start a new revision</button></div>`;
  }
  $("#docModalBody").innerHTML=`
    <span class="modal-x" onclick="closeDoc()">×</span>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0;font-size:20px">${esc(d.title)}</h2>${docPill(d.status)}
    </div>
    <p style="color:var(--muted);font-size:13px;margin:6px 0 12px">${esc(d.category||'Material')}${d.expires?` · expires ${esc(d.expires)}`:''}</p>
    ${preview}
    ${section}`;
}
function stepView(s){
  const icon={approved:"✅",active:"✍️",pending:"⏳",rejected:"⛔"}[s.status]||"•";
  if(s.status==="approved"){
    return `<div class="stp done">
      <div class="stp-h">${icon} <b>${esc(s.role)}</b> <span class="pill Approved">Signed</span></div>
      <div class="stp-b">Signed by <b>${esc(s.signed_name||s.assignee_name)}</b> · ${fmtWhen(s.signed_at)}<br>
        <span style="color:var(--ink-2)">“${esc(s.intent||'Approved.')}”</span>${s.comment?`<br><span style="color:var(--muted)">Note: ${esc(s.comment)}</span>`:''}</div></div>`;
  }
  if(s.status==="rejected"){
    return `<div class="stp rej">
      <div class="stp-h">${icon} <b>${esc(s.role)}</b> <span class="pill Rejected">Rejected</span></div>
      <div class="stp-b">${esc(s.signed_name||s.assignee_name)} · ${fmtWhen(s.signed_at)}${s.comment?`<br>“${esc(s.comment)}”`:''}</div></div>`;
  }
  if(s.status==="active"){
    const preset=(DOCROLES.find(r=>r.role===s.role)||{}).intent||"";
    return `<div class="stp act">
      <div class="stp-h">${icon} <b>${esc(s.role)}</b> <span class="pill Offer">Awaiting signature</span></div>
      <div class="stp-b">
        <p style="margin:2px 0 10px;color:var(--ink-2)">Assigned to ${esc(s.assignee_name||'—')}${s.assignee_email?` · ${esc(s.assignee_email)}`:''}</p>
        <label style="font-size:12px;font-weight:700;color:var(--muted)">Signed by (type full name)</label>
        <input id="sg_name" placeholder="Full name" value="${esc(s.assignee_name||'')}" style="margin:4px 0 10px">
        <label style="font-size:12px;font-weight:700;color:var(--muted)">Meaning of signature</label>
        <textarea id="sg_intent" rows="2" style="margin:4px 0 10px">${esc(preset)}</textarea>
        <label style="font-size:12px;font-weight:700;color:var(--muted)">Comment (optional)</label>
        <input id="sg_comment" placeholder="Optional note" style="margin:4px 0 12px">
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="signStep(${s.id})">🖊 Apply e-signature</button>
          <button class="btn btn-ghost btn-sm" onclick="rejectStep(${s.id})">Reject</button>
        </div>
        <p style="font-size:11.5px;color:var(--muted);margin:10px 0 0">By signing you confirm this is your legally binding electronic signature, stamped with your name and the date &amp; time.</p>
      </div></div>`;
  }
  return `<div class="stp wait">
    <div class="stp-h">${icon} <b>${esc(s.role)}</b> <span class="pill Pending">Waiting</span></div>
    <div class="stp-b" style="color:var(--muted)">Assigned to ${esc(s.assignee_name||'—')} — signs after the step above.</div></div>`;
}
async function submitRoute(id){
  const steps=[...document.querySelectorAll("#routeRows .rstep")].map(r=>({
    role:r.querySelector(".rrole").value, name:r.querySelector(".rname").value.trim(), email:r.querySelector(".remail").value.trim()
  })).filter(s=>s.role);
  if(!steps.length) return toast("Add at least one role");
  const {ok,data}=await api("/api/docs/documents/"+id+"/route",{method:"POST",body:JSON.stringify({steps})});
  if(!ok) return toast(data.error||"Could not send");
  CURDOC=data; renderDocModal(); toast("Sent for approval ✓"); viewDocs();
}
async function signStep(sid){
  const b={signed_name:$("#sg_name").value.trim(), intent:$("#sg_intent").value.trim(), comment:$("#sg_comment").value.trim()};
  if(!b.signed_name) return toast("Type your full name to sign");
  const {ok,data}=await api("/api/docs/steps/"+sid+"/sign",{method:"POST",body:JSON.stringify(b)});
  if(!ok) return toast(data.error||"Could not sign");
  CURDOC=data; renderDocModal(); toast(data.status==="Approved"?"Material approved ✓":"Signed ✓"); viewDocs();
}
async function rejectStep(sid){
  const reason=prompt("Reason for rejection (optional):")||"";
  const b={signed_name:($("#sg_name").value||"").trim(), comment:reason.trim()};
  const {ok,data}=await api("/api/docs/steps/"+sid+"/reject",{method:"POST",body:JSON.stringify(b)});
  if(!ok) return toast(data.error||"Could not reject");
  CURDOC=data; renderDocModal(); toast("Rejected"); viewDocs();
}
async function resetRoute(id){
  const {ok,data}=await api("/api/docs/documents/"+id+"/reset",{method:"POST"});
  if(!ok) return toast(data.error||"Error");
  CURDOC=data; renderDocModal(); viewDocs();
}

const ROUTES={dashboard:renderDashboard,store:renderStore,crm:viewCRM,hr:viewHR,ats:viewATS,docs:viewDocs};

/* ---------- auth ---------- */
let authMode="register",pending=null;
function openAuth(mode){
  authMode=mode;$("#authErr").classList.remove("show");
  $("#authTitle").textContent=mode==="register"?"Create your account":"Welcome back";
  $("#nameField").style.display=mode==="register"?"block":"none";
  $("#orgField").style.display=mode==="register"?"block":"none";
  $("#authSubmit").textContent=mode==="register"?"Create account":"Log in";
  $("#authSwitch").innerHTML=mode==="register"?`Already have an account? <a onclick="openAuth('login')">Log in</a>`:`New here? <a onclick="openAuth('register')">Create an account</a>`;
  $("#authOverlay").classList.add("open");
}
function closeAuth(){$("#authOverlay").classList.remove("open");}
async function submitAuth(e){
  e.preventDefault();const err=$("#authErr");err.classList.remove("show");
  const email=$("#f_email").value.trim(),pass=$("#f_pass").value,name=$("#f_name").value.trim(),org=$("#f_org").value.trim();
  const path=authMode==="register"?"/api/register":"/api/login";
  const body=authMode==="register"?{email,password:pass,name,org}:{email,password:pass};
  $("#authSubmit").disabled=true;
  const {ok,data}=await api(path,{method:"POST",body:JSON.stringify(body)});
  $("#authSubmit").disabled=false;
  if(!ok){err.textContent=data.error||"Something went wrong.";err.classList.add("show");return false;}
  closeAuth();
  await boot();
  if(pending){const p=pending;pending=null;activate(p);}
  return false;
}

/* ---------- purchase return ---------- */
async function handlePurchase(){
  const u=new URL(location.href);if(u.searchParams.get("purchased")!=="1")return;
  const sid=u.searchParams.get("session_id");history.replaceState({},"","/app");
  if(!sid)return;
  const {ok,data}=await api("/api/fulfill",{method:"POST",body:JSON.stringify({session_id:sid})});
  if(ok&&data.ok){toast("Module activated ✓");await refreshMe();VIEW=data.module==="suite"?"dashboard":data.module;renderShell();}
  else toast(data.error||"Couldn't confirm purchase.");
}

boot();
</script>
